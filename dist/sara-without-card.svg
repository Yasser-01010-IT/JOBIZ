  <text x="102" y="78" fill="#94a3b8" font-family="Inter, Arial, sans-serif" font-size="14">Parcours classique</text>
  <rect x="616" y="42" width="185" height="36" rx="10" fill="#17243a" stroke="#64748b" stroke-opacity=".4"/>
