  <path d="M36 108h768" stroke="#334155" stroke-opacity=".8"/>

  <g font-family="Inter, Arial, sans-serif">
    <circle cx="52" cy="153" r="10" fill="#17243a" stroke="#64748b" stroke-opacity=".45"/>
    <path d="M52 148v6m0 4h.01" stroke="#93c5fd" stroke-linecap="round" stroke-width="1.8"/>
    <text x="78" y="151" fill="#e2e8f0" font-size="15" font-weight="700">Dizaines de sites éparpillés</text>
    <text x="78" y="174" fill="#a7b3c5" font-size="13">Sara passe 3h chaque soir à jongler entre LinkedIn, Indeed, Monster et WTTJ.</text>

    <circle cx="52" cy="235" r="10" fill="#17243a" stroke="#64748b" stroke-opacity=".45"/>
    <path d="M52 230v6m0 4h.01" stroke="#93c5fd" stroke-linecap="round" stroke-width="1.8"/>
    <text x="78" y="233" fill="#e2e8f0" font-size="15" font-weight="700">Réécriture permanente</text>
    <text x="78" y="256" fill="#a7b3c5" font-size="13">Relit chaque annonce et réécrit son CV et sa lettre à chaque candidature.</text>

    <circle cx="52" cy="317" r="10" fill="#17243a" stroke="#64748b" stroke-opacity=".45"/>
    <path d="M52 312v6m0 4h.01" stroke="#93c5fd" stroke-linecap="round" stroke-width="1.8"/>
    <text x="78" y="315" fill="#e2e8f0" font-size="15" font-weight="700">Perte de suivi</text>
    <text x="78" y="338" fill="#a7b3c5" font-size="13">Candidatures oubliées, aucun outil de suivi et zéro relance au bon interlocuteur.</text>

    <circle cx="52" cy="399" r="10" fill="#17243a" stroke="#64748b" stroke-opacity=".45"/>
    <path d="M52 394v6m0 4h.01" stroke="#93c5fd" stroke-linecap="round" stroke-width="1.8"/>
