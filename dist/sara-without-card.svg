  <rect x="36" y="454" width="768" height="42" rx="12" fill="#17243a" stroke="#64748b" stroke-opacity=".42"/>
  <text x="56" y="480" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="600">Résultat : stress intense, retards sur les projets d’études et baisse de moral.</text>
